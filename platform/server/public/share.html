<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f8f53">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex">
  <title>Đang mở link hoàn tiền…</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <main class="auth-wrap">
    <div class="card big-status" id="working">
      <div class="spinner"></div>
      <h2>Đang tạo link hoàn tiền…</h2>
      <p class="muted small">Shopee sẽ tự mở lại sản phẩm trong giây lát.</p>
    </div>
    <div class="card" id="failed" hidden>
      <h2>Chưa tạo được link hoàn tiền</h2>
      <p class="msg err" id="failMsg"></p>
      <div class="btn-row">
        <button class="btn" id="retryBtn" type="button">Thử lại</button>
        <a class="btn ghost" href="/app/">Về ClickDeal</a>
      </div>
      <a class="btn ghost block mt" id="plainLink" hidden>Mở sản phẩm (không hoàn tiền)</a>
    </div>
  </main>
  <script src="/common.js"></script>
  <script src="/share.js"></script>
</body>
</html>
